[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-image-detector"
version = "0.1.0"
description = "Local MLOps pipeline for AI-generated image detection on web pages using CLIP and MLflow"
readme = "README.md"
authors = [{ name = "Eric Siqueira" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.35.0",
    "datasets>=2.16.0",
    "scikit-learn>=1.3.0",
    "mlflow>=2.10.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "imagehash>=4.3.1",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
    "evidently>=0.4.0",
    "python-multipart>=0.0.6",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "bandit>=1.7.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
